<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14242a">
  <meta name="description" content="A searchable, offline atlas of Enroth for Might and Magic VI.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Enroth Atlas — Might and Magic VI</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/map" data-route="map" aria-label="Enroth Atlas map"><span class="sigil">VI</span><span>Enroth <b>Atlas</b></span></a>
    <nav class="primary-nav" aria-label="Main navigation">
      <a href="#/map" data-route="map">World map</a>
      <a href="#/regions" data-route="regions">Regions</a>
      <a href="#/search" data-route="search">Search</a>

  <main class="app-shell">

      <button type="button" id="back-button" class="back-button" hidden>← Back</button>
