<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14242a">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('enroth-theme')==='light'?'light':'dark'}catch{}</script>
  <meta name="description" content="A searchable, offline atlas of Enroth for Might and Magic VI.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Enroth Atlas — Might and Magic VI</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/map" data-route="map" aria-label="Enroth Atlas map"><span class="sigil">VI</span><span>Enroth <b>Atlas</b></span></a>
    <nav class="primary-nav" aria-label="Main navigation">
      <a href="#/map" data-route="map">World map</a>
      <a href="#/items" data-route="items">Items</a>
      <a href="#/search" data-route="search">Search</a>
      <a href="#/about" data-route="about">About</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">☀ <span>Light</span></button>
  </header>
  <main class="app-shell">
    <div class="toolbar">
      <button type="button" id="back-button" class="back-button" hidden>← Back</button>
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
      <form id="quick-search" class="quick-search" role="search"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Search the atlas" aria-label="Search the atlas" autocomplete="off"><kbd>/</kbd></form>
    </div>
    <div class="atlas-layout">
      <aside class="world-rail" aria-label="World map navigation">
        <div class="world-rail-heading"><strong>Enroth</strong><span id="world-location">World map</span></div>
        <nav id="world-map" class="world-map" aria-label="Choose a region"></nav>
        <small>Choose a region</small>
      </aside>
      <div id="view" class="view" tabindex="-1"></div>
    </div>
  </main>
  <footer><span>Enroth Atlas · An unofficial fan archive</span><span><a href="LICENSE.md">Credits & license</a> · <a href="https://github.com/marnason/mm6-atlas">GitHub</a></span></footer>
  <script src="data.js"></script>
  <script src="openyamm-data.js"></script>
  <script src="items-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
